x-resolver-api-build: &resolver-api-build
  context: ../..
  dockerfile: services/dark-core-resolver-api/Dockerfile

services:
  resolver-api:
    build: *resolver-api-build
    ports:
      - "8002:8002"
    env_file:
      - .env.integration
    environment:
      - DARK_RPC_URL=http://rpc01:8545
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dark-net

networks:
  dark-net:
    external: true
    name: dark-net
