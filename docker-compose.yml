x-resolver-api-build: &resolver-api-build
  context: ../..
  dockerfile: services/dark-core-resolver-api/Dockerfile

services:
  resolver-api:
    build: *resolver-api-build
    ports:
      - "8002:8003"
    volumes:
      - metadata-storage:/app/metadata_storage:ro
    env_file:
      - .env.integration
    environment:
      - DARK_RPC_URL=http://rpc01:8545
      - METADATA_STORAGE_PATH=/app/metadata_storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dark-net

volumes:
  metadata-storage:
    external: true
    name: dark-core-minter-api_metadata-storage

networks:
  dark-net:
    external: true
    name: dark-net
